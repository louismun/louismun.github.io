<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X-Ray Tube</title>
<style>

body {
  display: flex;
  justify-content: center;
  padding: 120px;
  font-family: sans-serif;
}

#diagram {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: -1;
}

#word-bank {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 200px;
  height:calc(100% - 22px);
  border: 1px solid #aaa;
  padding: 10px;
  margin-left: auto;
}

#main-container {
  position: relative;
  height: 800px;
  min-width: 1200px;
}
.word {
  padding: 8px 14px;
  font-size: 20px;
  padding: 10px;
}

.drop-zone {
  position: absolute;
  width: 180px;
  height: 36px;
  border: 3px solid #A4C96C;
  background-color: #fff;
  padding: 6px 10px;
  box-sizing: border-box;
}

button {
  margin-top: 15px;
  padding: 5px 15px;
  cursor: pointer;
  font-size: 12px;
}

a {
  text-decoration: none;
}

h2 {
  text-align: center
}

</style>
</head>

<body>

<div id="main-container">
<h2>X-ray Tube</h2>
<img src="tube.png" id="diagram" />


<div class="drop-zone" data-answer="tube housing" style="top: 170px; left: 210px;"></div>
<div class="drop-zone" data-answer="anode" style="top: 710px; right: 660px;"></div>
<div class="drop-zone" data-answer="cathode" style="top: 710px; left: 710px;"></div>
<div class="drop-zone" data-answer="tungsten filaments" style="top: 560px; left: 950px;"></div>
<div class="drop-zone" data-answer="target anode" style="top: 750px; left: 600px;"></div>
<div class="drop-zone" data-answer="focusing cup" style="top: 475px; left: 690px;"></div>
<div class="drop-zone" data-answer="glass envelope" style="top: 220px; right: 360px;"></div>
<div class="drop-zone" data-answer="space charge" style="top: 270px; right: 460px;"></div>
<div class="drop-zone" data-answer="induction motor" style="top: 490px; right: 1050px;"></div>
<div class="drop-zone" data-answer="stator" style="top: 360px; right: 1050px;"></div>
<div class="drop-zone" data-answer="rotor" style="top: 230px; right: 580px;"></div>
<div class="drop-zone" data-answer="bearings" style="top: 400px; right: 1050px;"></div>
<div class="drop-zone" data-answer="tube window" style="top: 800px; right: 520px;"></div>

</div>
<div id="word-bank-container">
	<div id="word-bank">
		<div class="word" draggable="true" data-word="tube housing">tube housing</div>
		<div class="word" draggable="true" data-word="anode">anode</div>
		<div class="word" draggable="true" data-word="cathode">cathode</div>
		<div class="word" draggable="true" data-word="tungsten filaments">tungsten filament</div>
		<div class="word" draggable="true" data-word="target anode">target anode</div>  
		<div class="word" draggable="true" data-word="focusing cup">focusing cup</div>
	    <div class="word" draggable="true" data-word="glass envelope">glass envelope</div>
	    <div class="word" draggable="true" data-word="space charge">space charge</div>
		<div class="word" draggable="true" data-word="induction motor">induction motor</div>
		<div class="word" draggable="true" data-word="stator">stator</div>
		<div class="word" draggable="true" data-word="rotor">rotor</div>
		<div class="word" draggable="true" data-word="bearings">bearings</div>
		<div class="word" draggable="true" data-word="tube window">tube window</div>
  </div>
  <button onclick="reset()">Reset</button>
  <div style="padding-top:20px;font-size:12px">Made by Louis Mun</div>
</div>

<script>
  let dragging = null;		// word being dragged

  document.querySelectorAll('.word').forEach(w => {
    w.addEventListener('dragstart', () => dragging = w.dataset.word);	// set word being dragged
  });

  document.querySelectorAll('.drop-zone').forEach(dz => {
    dz.addEventListener('dragover', e => e.preventDefault());	// enable dragging mechanic
    dz.addEventListener('drop', e => {							// enable dropping mechanic
      e.preventDefault();
      if (dz.textContent) return;				// prevents replacing answers once filled
      if (dragging === dz.dataset.answer) {		// check answer
        dz.textContent = dragging;				// set word in box to answer
		document.querySelector(`.word[data-word="${dragging}"]`).remove();
      }
    });
  });

  function reset() {
    //document.querySelectorAll('.drop-zone').forEach(dz => dz.textContent = '');	// reset labels
	location.reload();
  }
  
  function shuffleWords() {
	  const container = document.getElementById('word-bank');
	  const words = Array.from(container.children);

	  // swap shuffle
	  for (let i = words.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[words[i], words[j]] = [words[j], words[i]];
	  }

	  words.forEach(word => container.appendChild(word));
  }
shuffleWords();
</script>
</body>
</html>
