<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 32px;
    }

    a {
      display: block;
      margin: 15px 0;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: 0.2s;
    }

    a:hover {
      background: #1d4ed8;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Louis Mun</h1>

    <a href="./xray/">
      My X-ray App
    </a>

    <a href="https://www.linkedin.com/in/louismun/" target="_blank" rel="noopener noreferrer">
      My LinkedIn
    </a>
  </div>
</body>
</html>
